[project]
name = "aerotrace-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
